[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bw-core = { path = "crates/bw-core" }
bw-sim = { path = "crates/bw-sim" }
bw-render = { path = "crates/bw-render" }
bw-io = { path = "crates/bw-io" }

# `wayland` and `x11` only affect Linux/BSD (winit needs at least one there).
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "wayland", "x11"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
# One native backend per OS: Metal (macOS), Vulkan/GL (Linux), DX12/Vulkan (Windows).
# wgpu only compiles each backend on the targets that support it.
wgpu = { version = "30.0.2", default-features = false, features = ["metal", "vulkan", "dx12", "gles", "wgsl"] }
muda = { version = "0.21.2", default-features = false }
# `xdg-portal` + `wayland` are the Linux backend (pure Rust, libdbus loaded at
# run time); they have no effect on macOS/Windows.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
glam = { version = "0.34.3", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
rstar = "0.14.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.5"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# No unsafe anywhere, and no `#[allow]` can bring it back.
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
deprecated_safe = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_extern_crates = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Restriction lints with no hits today: they keep it that way. `make lint`
# turns every warning into an error.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
mem_forget = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
exit = "warn"
clone_on_ref_ptr = "warn"
rc_mutex = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
verbose_file_reads = "warn"
create_dir = "warn"
unused_result_ok = "warn"
try_err = "warn"
empty_drop = "warn"
cfg_not_test = "warn"
format_push_string = "warn"
rest_pat_in_fully_bound_structs = "warn"
fn_to_numeric_cast_any = "warn"
large_stack_arrays = "warn"
large_futures = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
suspicious_xor_used_as_pow = "warn"
needless_raw_strings = "warn"
error_impl_error = "warn"
pathbuf_init_then_push = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"
