[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bw-core = { path = "crates/bw-core" }
bw-sim = { path = "crates/bw-sim" }
bw-render = { path = "crates/bw-render" }
bw-io = { path = "crates/bw-io" }

eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
wgpu = { version = "30.0.2", default-features = false, features = ["metal", "wgsl"] }
muda = { version = "0.21.2", default-features = false }
rfd = { version = "0.18.0", default-features = false }
glam = { version = "0.34.3", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
rstar = "0.14.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.5"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"
