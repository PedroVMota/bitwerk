[package]
name = "bw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
bw-io = { path = "../crates/bw-io" }

# Standalone workspace so the fuzz crate never affects the main build.
[workspace]
members = ["."]

[[bin]]
name = "load_project"
path = "fuzz_targets/load_project.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
