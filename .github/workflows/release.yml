name: Release

# Manual only: Actions → Release → Run workflow, then enter the version.
# Builds the Linux and Windows binaries from the selected branch, then creates
# the tag `v<version>` and a GitHub release whose notes list every commit
# since the previous tag (or every commit, for the first release).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              range="$prev..HEAD"
            else
              echo "## Changes"
              range="HEAD"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s (%h)'
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p bw-app --bin bitwerk --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="bitwerk-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.name }}" = windows ]; then
            cp "target/${{ matrix.target }}/release/bitwerk.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/bitwerk" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r examples "dist/$name/"
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  release:
    name: Tag and release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          mv artifacts/bin-*/* dist/
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file artifacts/notes/notes.md \
            "${flags[@]}"
