name: Release

# Runs when a pull request is merged into main (any merge method). The
# version label of the pull request decides the next version, counted from the
# latest stable tag v<major>.<minor>.<patch>:
#   fix             -> patch
#   major           -> minor
#   breaking change -> major
# It builds the Linux and Windows binaries (no macOS), then creates the tag
# and a GitHub release with both packages and SHA256SUMS.txt. Pushes to main
# that are not a merged pull request, whose pull request has no version label,
# or whose pull request carries the label `no-deploy`, do not release.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Never two releases at once: the second would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Next version from the pull request label
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name')
          bump=""
          # `no-deploy` wins over any version label.
          if grep -qxF 'no-deploy' <<<"$labels"; then
            echo "::notice::Pull request labelled no-deploy: no release."
            exit 0
          fi
          for l in $labels; do
            case "$l" in
              "breaking change") bump=breaking ;;
              major) [ "$bump" = breaking ] || bump=major ;;
              fix) [ -n "$bump" ] || bump=fix ;;
            esac
          done
          if [ -z "$bump" ]; then
            echo "::notice::No merged pull request with a fix / major / breaking change label for $GITHUB_SHA: no release."
            exit 0
          fi
          prev=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          prev=${prev:-v0.0.0}
          IFS=. read -r major minor patch <<<"${prev#v}"
          case "$bump" in
            breaking) major=$((major + 1)); minor=0; patch=0 ;;
            major) minor=$((minor + 1)); patch=0 ;;
            fix) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "$prev + $bump -> $tag"
          {
            echo "release=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$prev" = v0.0.0 ]; then
              echo "## Changes"
              range="HEAD"
            else
              echo "## Changes since $prev"
              range="$prev..HEAD"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s (%h)'
            if [ "$prev" != v0.0.0 ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$tag"
            fi
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: notes
          path: notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p bw-app --bin bitwerk --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="bitwerk-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.name }}" = windows ]; then
            cp "target/${{ matrix.target }}/release/bitwerk.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/bitwerk" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r examples "dist/$name/"
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  release:
    name: Tag and release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          mv artifacts/bin-*/* dist/
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file artifacts/notes/notes.md
