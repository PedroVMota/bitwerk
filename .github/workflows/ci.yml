name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain; rustup is preinstalled on
      # the hosted runners and installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # On failure, regenerate the checked-in generated files and show how they
      # differ on this runner.
      - name: Diff generated files
        if: failure()
        shell: bash
        env:
          BITWERK_REGEN_LIBRARY: "1"
        run: |
          cargo test -p bw-sim --test library --locked -- up_to_date || true
          git -c core.quotepath=off diff --stat
          git diff | head -c 20000 | cat -A | head -200
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
