name: CI

# Runs only for a pull request that carries a version level label (fix, major
# or breaking change), and again when labels change. Without one the jobs are
# skipped, so no Linux or Windows runner is billed. Pushes do not run it: the
# Release workflow tests again before publishing.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# A new push or label change cancels the run still in progress for the PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    if: >-
      contains(github.event.pull_request.labels.*.name, 'fix') ||
      contains(github.event.pull_request.labels.*.name, 'major') ||
      contains(github.event.pull_request.labels.*.name, 'breaking change')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain; rustup is preinstalled on
      # the hosted runners and installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
